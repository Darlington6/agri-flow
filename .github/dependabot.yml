version: 2

# Everything targets dev, matching the feature -> dev -> staging -> main flow.
#
# Grouping keeps the PR count manageable: routine minor/patch bumps arrive as
# one PR per ecosystem, while major versions still arrive one PR each, since
# those are the ones that need a real look. Every PR title is a Conventional
# Commit (build(deps): ... / build(deps-dev): ...) so it passes the PR policy
# check and squash-merges cleanly into dev.

updates:
  - package-ecosystem: "npm"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "build"
      prefix-development: "build"
      include: "scope"
    groups:
      web-runtime:
        dependency-type: "production"
        update-types: ["minor", "patch"]
      web-dev:
        dependency-type: "development"
        update-types: ["minor", "patch"]
    ignore:
      # Deliberate upgrades, not Dependabot bumps:
      # - TypeScript 7 is the new native compiler; it needs its own branch.
      # - @types/node should match the Node major CI and Docker run (20).
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    open-pull-requests-limit: 10

  - package-ecosystem: "pip"
    directory: "/apps/api"
    target-branch: "dev"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "build"
      prefix-development: "build"
      include: "scope"
    # requirements.txt is exported from poetry.lock (for Vercel), not a
    # manifest of its own. Left visible, Dependabot bumps its pins separately
    # from the lock and the two drift apart. Regenerate it on Dependabot PRs
    # instead (see CONTRIBUTING).
    exclude-paths:
      - "requirements.txt"
    groups:
      api-runtime:
        dependency-type: "production"
        update-types: ["minor", "patch"]
      api-dev:
        dependency-type: "development"
    ignore:
      # Django 6 is a deliberate upgrade (DRF, simplejwt, drf-spectacular and
      # django-cors-headers all need to support it first), not a Dependabot
      # bump. pyproject.toml caps django <6.0 until that upgrade happens.
      - dependency-name: "django"
        update-types: ["version-update:semver-major"]
    open-pull-requests-limit: 10

  - package-ecosystem: "docker"
    directory: "/apps/api"
    target-branch: "dev"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "build"
      include: "scope"
    ignore:
      # Python is pinned to 3.12 in .python-version, CI and Vercel. A new
      # Python version (3.12 -> 3.15 is a "minor" tag bump) is a deliberate
      # upgrade across all of those at once.
      - dependency-name: "python"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  - package-ecosystem: "docker"
    directory: "/apps/web"
    target-branch: "dev"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "build"
      include: "scope"
    ignore:
      # Node major versions move CI, Docker and @types/node together, as one
      # deliberate upgrade.
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
      include: "scope"
    groups:
      github-actions:
        patterns: ["*"]

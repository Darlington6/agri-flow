name: CI

on:
  pull_request:
    branches: [dev, staging, main]
  push:
    branches: [dev, staging, main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: web (lint, typecheck, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm run lint

      # apps/web's build script runs `tsc -b` first, so this covers
      # typecheck + build in one step.
      - run: pnpm run build

  api:
    name: api (lint, check, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: agriflow
          POSTGRES_PASSWORD: agriflow
          POSTGRES_DB: agriflow
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U agriflow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      DJANGO_SECRET_KEY: ci-only-not-a-real-secret
      DJANGO_DEBUG: "True"
      DATABASE_URL: postgres://agriflow:agriflow@localhost:5432/agriflow
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4

      # uv reads the Python version from apps/api/.python-version and the
      # exact dependency versions from apps/api/uv.lock, the same lock
      # Vercel and the Dockerfile install from. Keep the uv version in sync
      # with apps/api/Dockerfile.
      - uses: astral-sh/setup-uv@v10
        with:
          version: "0.13.7"
          working-directory: apps/api
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock

      # --locked fails if uv.lock is out of date with pyproject.toml, so a
      # dependency change without a re-lock can't get past CI.
      - run: uv sync --locked

      - run: uv run --no-sync ruff check .

      - run: uv run --no-sync ruff format --check .

      - run: uv run --no-sync python manage.py check

      - run: uv run --no-sync pytest -q

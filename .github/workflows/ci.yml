name: CI

on:
  pull_request:
    branches: [dev, staging, main]
  push:
    branches: [dev, staging, main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: web (lint, typecheck, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.9

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm run lint

      # apps/web's build script runs `tsc -b` first, so this covers
      # typecheck + build in one step.
      - run: pnpm run build

  api:
    name: api (lint, check, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: agriflow
          POSTGRES_PASSWORD: agriflow
          POSTGRES_DB: agriflow
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U agriflow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      DJANGO_SECRET_KEY: ci-only-not-a-real-secret
      DJANGO_DEBUG: "True"
      DATABASE_URL: postgres://agriflow:agriflow@localhost:5432/agriflow
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # Poetry 2.x is required: pyproject.toml uses the standard PEP 621
      # [project] table, which Poetry 1.x can't read. Keep this pin in sync
      # with apps/api/Dockerfile.
      - run: pip install poetry==2.4.1 poetry-plugin-export==1.10.1

      - uses: actions/cache@v6
        with:
          path: ~/.cache/pypoetry
          key: poetry-${{ runner.os }}-${{ hashFiles('apps/api/poetry.lock') }}

      - run: poetry install

      - run: poetry run ruff check .

      - run: poetry run ruff format --check .

      # requirements.txt is what Vercel installs from; it must be exactly
      # what poetry.lock resolves to, or production silently runs different
      # versions (or misses packages) compared to CI and Docker.
      - name: requirements.txt matches poetry.lock
        run: |
          poetry export --without-hashes --only main -f requirements.txt -o /tmp/requirements.txt
          diff -u requirements.txt /tmp/requirements.txt || {
            echo "::error file=apps/api/requirements.txt::Out of sync with poetry.lock. Regenerate with: poetry export --without-hashes --only main -f requirements.txt -o requirements.txt"
            exit 1
          }

      - run: poetry run python manage.py check

      - run: poetry run pytest -q

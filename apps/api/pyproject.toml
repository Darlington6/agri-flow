[project]
name = "agriflow-api"
version = "0.1.0"
description = "AgriFlow API — Django + DRF backend (Platform Blueprint, Section 2)"
authors = [{ name = "AgriFlow" }]
requires-python = ">=3.12,<4"
dependencies = [
    "django>=5.1,<6.0",
    "djangorestframework>=3.15,<4.0",
    "drf-spectacular>=0.28,<0.29",
    "django-environ>=0.11,<0.12",
    "django-cors-headers>=4.4,<5.0",
    "psycopg[binary]>=3.2,<4.0",
    "celery>=5.4,<6.0",
    "redis>=5.0,<6.0",
    "gunicorn>=23.0,<24.0",
    "djangorestframework-simplejwt>=5.5.1,<6.0",
    "phonenumbers>=9.0.37,<10.0",
]

[dependency-groups]
dev = [
    "ruff>=0.7,<0.8",
    "pytest>=8.3,<9",
    "pytest-django>=4.9,<5",
]

[tool.uv]
# An application, not a library: uv installs the dependencies and never
# builds or installs the project itself.
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
# Django-generated, never hand-edited — not worth linting for style.
exclude = ["**/migrations/*.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.dev"
python_files = ["test_*.py", "*_test.py", "tests.py"]
